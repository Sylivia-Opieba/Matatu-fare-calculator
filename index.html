<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matatu Fare - Rongai</title>
<style>
body{background:#FFD600;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:white;padding:30px;border-radius:20px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center}
h1{color:#111;margin:0 0 5px}
select,button{width:100%;padding:14px;margin:10px 0;border-radius:12px;font-size:16px}
select{border:2px solid #ddd}
button{background:#111;color:#FFD600;font-weight:bold;border:none}
button:active{transform:scale(0.98)}
#result{margin-top:20px;font-size:20px;font-weight:bold}
small{color:#666}
</style>
</head>
<body>
<div class="card">
<h1>🚌 Matatu Fare</h1>
<p>#MyFirstCode - By Sylvia from Rongai</p>
<p>Select your route:</p>
<select id="route">
<option value="50">Rongai - Town (50 KES)</option>
<option value="70">Rongai - Westlands (80 KES)</option>
<option value="100">Rongai - CBD - Kitengela (100 KES)</option>
<option value="30">Rongai - Kiserian (30 KES)</option>
</select>
<button onclick="checkFare()">Check Fare</button>
<p id="result"></p>
<p style="font-size:12px;opacity:0.6">Built with HTML for #MyFirstCode challenge</p>
</div>
<script>
function checkFare(){
let fare=document.getElementById('route').value;
let routeText=document.getElementById('route').options[document.getElementById('route').selectedIndex].text;
document.getElementById('result').innerHTML="Fare: <b>"+fare+" KES</b><br><small>"+routeText+"</small>";
}
</script>
</body>
</html>
